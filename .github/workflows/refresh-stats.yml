name: Refresh GitHub stats card

# Regenerates assets/github-stats.svg so the profile README card stays current.
# Self-hosted on purpose: github-readme-stats.vercel.app is a shared free
# instance that gets paused and 503s, which left a broken image on the profile.
# Everything here uses public endpoints, so no secrets are required.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:        # and on demand

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate stats card
        run: node build-stats.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/github-stats.svg; then
            echo "No change in stats card."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git commit -m "chore: refresh GitHub stats card"
          git push
